# GoReleaser: publishes the `noetivela` CLI binaries (Apache-2.0) on tags.
# Built from the cli module; the sdk is consumed via replace (module path).
version: 2
project_name: noetivela-cli
builds:
  - id: noetivela
    dir: cli
    main: .
    binary: noetivela
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod: mod
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - none*
checksum:
  name_template: checksums.txt
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  header: |
    ## NOETIVELA CLI {{ .Tag }}

    Prebuilt `noetivela` binaries for linux/darwin/windows on amd64/arm64.
    See the README "CLI / Binaries" section for installation and usage.
